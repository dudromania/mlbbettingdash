<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB EDGE — Slate</title>
<style>
:root{
  --bg:#0a0d12; --panel:#111620; --panel2:#161c28;
  --line:#1e2734; --line2:#2a3547;
  --t1:#e8edf5; --t2:#8b99ad; --t3:#5a6678;
  --pos:#3ddc97; --neg:#ff5f5f; --warn:#ffb84d; --hi:#4da3ff;
  --spine:#2a3547;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.45;padding-bottom:60px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.dim{color:var(--t3)}.t2{color:var(--t2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--t3);display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow .count{color:var(--t2)}
.mast{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
.mast-in{max-width:1240px;margin:0 auto;padding:11px 16px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.logo span{color:var(--hi)}
.mast .date{font-family:var(--mono);font-size:12px;color:var(--t2)}
.mast .stamp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t3)}
.stamp b{color:var(--t2);font-weight:400}
.ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel);margin-top:18px}
.rib{padding:12px 14px;border-right:1px solid var(--line)}
.rib:last-child{border-right:0}
.rib .v{font-family:var(--mono);font-size:22px;line-height:1.1;font-weight:600}
.rib .l{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-top:4px}
.strip{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:3px;
  background:var(--panel);margin-top:10px;scrollbar-width:thin}
.strip::-webkit-scrollbar{height:5px}
.strip::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.sgame{flex:0 0 auto;min-width:104px;padding:9px 13px;border-right:1px solid var(--line);
  font-family:var(--mono);font-size:12px}
.sgame:last-child{border-right:0}
.srow{display:flex;justify-content:space-between;gap:12px}
.sgame .st{font-size:9px;color:var(--t3);letter-spacing:.1em;margin-top:3px}
.sgame .live{color:var(--warn)}
.card{border:1px solid var(--line);border-radius:4px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.card.flag{box-shadow:inset 3px 0 0 var(--pos)}
.crow{display:grid;grid-template-columns:74px minmax(118px,1.1fr) minmax(110px,1.2fr) 56px 50px 90px 60px minmax(86px,1fr) 24px;
  gap:10px;align-items:center;width:100%;padding:10px 13px;background:none;border:0;
  font-family:var(--mono);font-size:12px;color:var(--t1);text-align:left;cursor:pointer}
.crow:hover{background:rgba(77,163,255,.05)}
.crow[aria-expanded="true"]{background:var(--panel2);border-bottom:1px solid var(--line)}
.crow .mu{font-size:13px;font-weight:600;letter-spacing:.04em}
.crow .mu .at{color:var(--t3);font-weight:400;margin:0 5px}
.crow .sp{color:var(--t2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .chev{color:var(--t3);transition:transform .18s;justify-self:end}
.crow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.body{display:none}
.card.open .body{display:block}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid currentColor}
.tag.strong{color:var(--pos)}.tag.lean{color:var(--warn)}.tag.none{color:var(--t3)}
.spine{display:grid;grid-template-columns:1fr 76px 1fr;align-items:stretch}
.side{padding:12px 14px;min-width:0}
.side.away{text-align:right}
.axis{border-left:1px solid var(--spine);border-right:1px solid var(--spine);
  background:rgba(255,255,255,.012);display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:12px 4px;gap:2px}
.axis .lbl{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.axis .val{font-family:var(--mono);font-size:13px;font-weight:600}
.axis .sub{font-family:var(--mono);font-size:10px;color:var(--t2)}
.axis .gap{height:11px}
.sp-name{font-family:var(--mono);font-size:13px;font-weight:600}
.sp-hand{color:var(--t3);font-weight:400;font-size:11px}
.sp-line{font-family:var(--mono);font-size:11px;color:var(--t2);margin-top:3px;display:flex;gap:9px}
.side.away .sp-line{justify-content:flex-end}
.sp-line b{color:var(--t1);font-weight:600}
.form{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.bars{border-top:1px solid var(--line);padding:4px 14px 12px}
.grp{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--t3);margin:11px 0 6px;display:flex;align-items:center;gap:8px}
.grp::before,.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.bar{display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;margin-bottom:6px}
.bar:last-child{margin-bottom:0}
.bar-l,.bar-r{display:flex;align-items:center;gap:8px;min-width:0}
.bar-l{justify-content:flex-end}
.track{flex:1;height:5px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.bar-l .track{justify-content:flex-end}
.fill{height:100%;border-radius:2px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar-n{font-family:var(--mono);font-size:11px;min-width:46px}
.bar-l .bar-n{text-align:left}
.bar-r .bar-n{text-align:right}
.bar-k{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--t3);text-align:center}
.pips{display:flex;gap:2px;justify-content:center}
.bar-l .pips{justify-content:flex-end}
.pip{width:7px;height:7px;border-radius:1px;background:var(--line2)}
.pip.w{background:var(--pos)}.pip.l{background:var(--neg)}
.ctx{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);background:rgba(0,0,0,.16)}
.ci{padding:7px 13px;font-family:var(--mono);font-size:10.5px;color:var(--t2);
  border-right:1px solid var(--line);display:flex;gap:6px;align-items:center}
.ci:last-child{border-right:0}
.ci .k{color:var(--t3);letter-spacing:.1em;text-transform:uppercase;font-size:9px}
.dd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;
  border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0;background:var(--panel2)}
select{font-family:var(--mono);font-size:13px;background:var(--bg);color:var(--t1);
  border:1px solid var(--line2);border-radius:3px;padding:7px 11px;min-width:250px;cursor:pointer}
select:focus-visible,.crow:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.dd-body{border:1px solid var(--line);border-radius:0 0 3px 3px;background:var(--panel)}
.lu{display:grid;grid-template-columns:1fr 1px 1fr}
.lu-div{background:var(--spine)}
.lu-hd{display:flex;align-items:baseline;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.16)}
.lu-hd .tm{font-family:var(--mono);font-size:13px;font-weight:600}
.lu-hd .rl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.lu-hd .vs{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--t2)}
.bat{display:grid;grid-template-columns:18px 26px 1fr auto;gap:9px;padding:5px 13px;
  font-family:var(--mono);font-size:11.5px;align-items:center;border-bottom:1px solid rgba(30,39,52,.4)}
.bat:last-child{border-bottom:0}
.bat .ord{color:var(--t3);font-size:10px}
.bat .ps{color:var(--t2);font-size:10px}
.bat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bat .st{color:var(--t2);font-size:10.5px;display:flex;gap:8px}
.bat .hand{color:var(--t3);font-size:9px}
.empty{padding:22px 13px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--t3)}
.panels{border-top:1px solid var(--line)}
.pnl{border-bottom:1px solid var(--line)}
.pnl:last-child{border-bottom:0}
.pnl-h{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--t3);padding:9px 13px 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;
  background:var(--line);margin-top:9px}
.kcell{background:var(--panel);padding:9px 11px}
.kcell .v{font-family:var(--mono);font-size:15px;font-weight:600}
.kcell .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--t3);margin-top:3px}
.kcell .x{font-family:var(--mono);font-size:10px;color:var(--t2);margin-top:2px}
.note{font-family:var(--mono);font-size:10.5px;color:var(--t3);padding:9px 14px;
  border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px;background:rgba(0,0,0,.2)}
@media(max-width:860px){
  .crow{grid-template-columns:62px 1fr 52px 58px 22px;row-gap:4px}
  .crow .sp,.crow .mdl,.crow .tot{display:none}
}
@media(max-width:720px){
  .spine,.bar{grid-template-columns:1fr 62px 1fr}
  .lu{grid-template-columns:1fr}
  .lu-div{height:1px;width:100%}
  .side{padding:10px}
  .rib .v{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="logo">MLB<span>/</span>EDGE</div>
    <div class="date mono" id="hdr-date">—</div>
    <div class="stamp mono">model run <b id="hdr-stamp">—</b></div>
  </div>
</header>
<div class="wrap">
  <div class="ribbon" id="ribbon"></div>
  <div class="strip" id="strip"></div>
  <div class="eyebrow">Plays <span class="count" id="cnt-plays"></span></div>
  <div id="plays"></div>
  <div class="eyebrow">Rest of slate <span class="count" id="cnt-slate"></span></div>
  <div id="slate"></div>
  <div class="eyebrow">Lineups &amp; detail</div>
  <div class="dd-head">
    <label for="dd-sel" class="mono dim" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase">Game</label>
    <select id="dd-sel"></select>
    <div class="mono dim" id="dd-meta" style="font-size:11px"></div>
  </div>
  <div class="dd-body" id="dd-body"></div>
  <div class="note" id="dd-note">Lineups post about two hours before first pitch.</div>
</div>
<script>
const DATA={cards:[],pens:[],scores:[],lineups:null,team:{},standings:{},demo:false};
async function loadJSON(p,fb){try{const r=await fetch(p+'?v='+Date.now());if(!r.ok)throw 0;return await r.json();}catch(e){return fb;}}
const num=v=>(v===null||v===undefined||v==='')?null:(isNaN(+v)?null:+v);
const pick=(o,...k)=>{for(const x of k){if(o&&o[x]!==undefined&&o[x]!==null)return o[x];}return null;};
function normGame(g){return{
  raw:g,
  away:pick(g,'away_abbr','away_team','away')||'—',
  home:pick(g,'home_abbr','home_team','home')||'—',
  time:pick(g,'game_time_ct','game_time','time','start_time')||'',
  awaySP:pick(g,'away_sp','away_pitcher')||'TBD',
  homeSP:pick(g,'home_sp','home_pitcher')||'TBD',
  spread:num(pick(g,'vegas_spread','book_spread','spread')),
  total:num(pick(g,'vegas_total','book_total','total')),
  mlHome:num(pick(g,'vegas_ml_home','ml_home')),
  mlAway:num(pick(g,'vegas_ml_away','ml_away')),
  predMargin:num(pick(g,'predicted_margin','pred_margin')),
  predTotal:num(pick(g,'predicted_total','pred_total')),
  winProb:num(pick(g,'home_win_prob','win_prob')),
  coverProb:num(pick(g,'cover_prob')),
  overProb:num(pick(g,'over_prob')),
  edgeSpread:num(pick(g,'edge_spread')),
  edgeTotal:num(pick(g,'edge_total')),
  spreadBet:pick(g,'spread_bet'), totalBet:pick(g,'total_bet'),
  spreadLabel:pick(g,'spread_edge_label')||'', totalLabel:pick(g,'total_edge_label')||'',
  conf:num(pick(g,'spread_confidence','confidence','edge_score')),
  park:num(pick(g,'park_runs_factor')),
  temp:num(pick(g,'weather_temp','weather_temp_f')),
  wind:num(pick(g,'weather_wind_mph')),
  dome:pick(g,'is_dome'), venue:pick(g,'venue','park_name')||''
};}
const odds=v=>v===null?'—':(v>0?'+'+v:''+v);
const sgn=(v,d=1)=>v===null?'—':(v>0?'+':'')+v.toFixed(d);
const pct=v=>v===null?'—':(v<=1?(v*100).toFixed(0):v.toFixed(0))+'%';
const pct1=v=>v===null?'—':(v<=1?(v*100).toFixed(1):v.toFixed(1))+'%';
const dec=(v,d=2)=>v===null?'—':v.toFixed(d);
const cls=v=>v===null?'dim':(v>0?'pos':(v<0?'neg':'dim'));
const last=n=>(n||'').split(' ').pop();
const t3=v=>v.toFixed(3).replace(/^0/,'');
function tagFor(l){const L=(l||'').toUpperCase();
  if(L==='STRONG')return '<span class="tag strong">strong</span>';
  if(L==='LEAN')return '<span class="tag lean">lean</span>';
  if(L==='CAPPED')return '<span class="tag none">capped</span>';return '';}
function betText(g){
  if(g.spreadBet==='home_cover')return g.home+' '+sgn(g.spread);
  if(g.spreadBet==='away_cover')return g.away+' '+sgn(g.spread===null?null:-g.spread);
  if(g.totalBet==='over')return 'Over '+dec(g.total,1);
  if(g.totalBet==='under')return 'Under '+dec(g.total,1);return null;}
function bestEdge(g){const e=[g.edgeSpread,g.edgeTotal].filter(x=>x!==null).map(Math.abs);return e.length?Math.max(...e):null;}
function bar(key,a,h,o){
  o=o||{};const fmt=o.fmt||(v=>dec(v,2));const lb=!!o.lowerBetter;
  a=num(a);h=num(h);
  if(a===null&&h===null)return '';
  const base=o.base||0;
  const av=a===null?base:a, hv=h===null?base:h;
  const span=Math.max(Math.abs(av-base),Math.abs(hv-base))||1;
  const aw=Math.min(100,Math.abs(av-base)/span*100), hw=Math.min(100,Math.abs(hv-base)/span*100);
  let aC='var(--line2)',hC='var(--line2)';
  if(a!==null&&h!==null&&a!==h){const ab=lb?a<h:a>h;aC=ab?'var(--pos)':'var(--line2)';hC=ab?'var(--line2)':'var(--pos)';}
  return '<div class="bar"><div class="bar-l"><span class="bar-n '+(a===null?'dim':'')+'">'+(a===null?'—':fmt(a))+'</span>'+
    '<span class="track"><span class="fill" style="width:'+aw+'%;background:'+aC+'"></span></span></div>'+
    '<div class="bar-k">'+key+'</div>'+
    '<div class="bar-r"><span class="track"><span class="fill" style="width:'+hw+'%;background:'+hC+'"></span></span>'+
    '<span class="bar-n '+(h===null?'dim':'')+'">'+(h===null?'—':fmt(h))+'</span></div></div>';
}
function cardFor(n){if(!n||n==='TBD')return null;const q=n.toLowerCase().trim();
  return DATA.cards.find(c=>{const cn=(c.name||'').toLowerCase().trim();
    return cn===q||(cn&&q&&(cn.includes(q)||q.includes(cn)));})||null;}
const penFor=a=>DATA.pens.find(p=>p.team===a)||null;
const teamFor=a=>DATA.team[a]||null;
const stFor=a=>DATA.standings[a]||null;
const fatCls=f=>f==='HEAVY'?'neg':f==='TIRED'?'warn':f==='FRESH'?'pos':'t2';
function pips(rec){
  if(!rec)return '';
  const m=/^(\d+)-(\d+)$/.exec(rec);if(!m)return '';
  const w=+m[1],l=+m[2];let out='';
  for(let i=0;i<w;i++)out+='<span class="pip w"></span>';
  for(let i=0;i<l;i++)out+='<span class="pip l"></span>';
  return '<div class="pips">'+out+'</div>';
}
function spineBody(g){
  const aC=cardFor(g.awaySP), hC=cardFor(g.homeSP);
  const aP=penFor(g.away), hP=penFor(g.home);
  const aT=teamFor(g.away), hT=teamFor(g.home);
  const aS=stFor(g.away),   hS=stFor(g.home);
  const spB=(name,c,side)=>{
    const ss=(c&&c.season_stats)||{};
    const era=num(pick(ss,'era','ERA')),k9=num(pick(ss,'k9','k_9','K/9')),whip=num(pick(ss,'whip','WHIP'));
    const tr=((c&&c.trend)||'').toString().toLowerCase();
    const tc=tr.indexOf('hot')>=0?'pos':tr.indexOf('cold')>=0?'neg':'dim';
    const kp=(c&&c.k_prediction)||{};
    return '<div class="side '+side+'">'+
      '<div class="sp-name">'+name+(c&&c.throws?' <span class="sp-hand">'+c.throws+'HP</span>':'')+'</div>'+
      '<div class="sp-line"><span>ERA <b>'+dec(era)+'</b></span><span>K/9 <b>'+dec(k9,1)+'</b></span><span>WHIP <b>'+dec(whip)+'</b></span></div>'+
      '<div class="sp-line dim"><span>L3 '+dec(c?num(c.l3_era):null)+'</span>'+
        (kp.predicted_ks!==undefined?'<span>proj '+dec(kp.predicted_ks,1)+'K</span>':'')+'</div>'+
      (tr?'<div class="form '+tc+'">'+tr+'</div>':'')+'</div>';};
  const aSS=(aC&&aC.season_stats)||{}, hSS=(hC&&hC.season_stats)||{};
  const wp=v=>v===null?null:(v>1?v:v*100);
  return '<div class="body">'+
    '<div class="spine">'+spB(g.awaySP,aC,'away')+
      '<div class="axis">'+
        '<div class="lbl">run line</div><div class="val">'+sgn(g.spread)+'</div>'+
        '<div class="sub '+cls(g.edgeSpread)+'">'+(g.edgeSpread===null?'':pct1(g.edgeSpread))+'</div>'+
        '<div class="gap"></div><div class="lbl">total</div><div class="val">'+dec(g.total,1)+'</div>'+
        '<div class="sub '+cls(g.edgeTotal)+'">'+(g.edgeTotal===null?'':pct1(g.edgeTotal))+'</div>'+
        '<div class="gap"></div><div class="lbl">moneyline</div>'+
        '<div class="sub mono">'+odds(g.mlAway)+' / '+odds(g.mlHome)+'</div>'+
      '</div>'+spB(g.homeSP,hC,'home')+'</div>'+
    '<div class="bars">'+
      '<div class="grp">offense</div>'+
      bar('wRC+', aT?aT.wrc:null, hT?hT.wrc:null, {fmt:v=>v.toFixed(0),base:85})+
      bar('OPS',  aT?aT.ops:null, hT?hT.ops:null, {fmt:t3,base:.600})+
      bar('ISO',  aT?aT.iso:null, hT?hT.iso:null, {fmt:t3,base:.100})+
      bar('K% low good', aT?aT.k:null, hT?hT.k:null, {fmt:v=>v.toFixed(1)+'%',lowerBetter:true,base:16})+
      '<div class="grp">starter</div>'+
      bar('ERA',  num(pick(aSS,'era','ERA')), num(pick(hSS,'era','ERA')), {lowerBetter:true,base:1.5})+
      bar('K/9',  num(pick(aSS,'k9','k_9')), num(pick(hSS,'k9','k_9')), {fmt:v=>dec(v,1),base:5})+
      bar('WHIP', num(pick(aSS,'whip','WHIP')), num(pick(hSS,'whip','WHIP')), {lowerBetter:true,base:.85})+
      '<div class="grp">bullpen</div>'+
      bar('ERA', aP?num(aP.era):null, hP?num(hP.era):null, {lowerBetter:true,base:2.5})+
      bar('IP last 3d', aP?num(aP.innings_3d):null, hP?num(hP.innings_3d):null, {fmt:v=>dec(v,1),lowerBetter:true,base:6})+
      '<div class="grp">form &amp; model</div>'+
      bar('run diff', aS?aS.rd:null, hS?hS.rd:null, {fmt:v=>(v>0?'+':'')+v.toFixed(0),base:0})+
      bar('L10 wins', aS?aS.l10w:null, hS?hS.l10w:null, {fmt:v=>v.toFixed(0)+'-'+(10-v).toFixed(0),base:0})+

function renderRibbon(games){

  const confs=games.map(g=>g.conf).filter(x=>x!==null);
  const avg=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:null;

    ['games',games.length,''],['plays',plays.length,plays.length?'pos':'dim'],

function renderGames(games){

  flagged.sort((a,b)=>(bestEdge(b.g)||0)-(bestEdge(a.g)||0));
  const P=document.getElementById('plays'), S=document.getElementById('slate');
  P.innerHTML=flagged.length?flagged.map(o=>cardHTML(o.g,o.i,true)).join('')

  S.innerHTML=rest.map(o=>cardHTML(o.g,o.i,false)).join('');

function lineupFor(abbr,g){
  const L=DATA.lineups;if(!L)return null;
  const box=L[g.away+'@'+g.home]||(g.raw&&L[g.raw.game_id])||null;
  if(box)return abbr===g.away?(box.away||box.away_lineup):(box.home||box.home_lineup);
  if(Array.isArray(L)){const r=L.find(x=>x.team===abbr||x.team_abbr===abbr);return r?(r.lineup||r.batters):null;}
  return L[abbr]||null;
}

async function loadStandings(){

      const sr=(tr.records&&tr.records.splitRecords)||[];

        rd:(parseInt(tr.runsScored||0)-parseInt(tr.runsAllowed||0)),
        l10:l10?l10.wins+'-'+l10.losses:null,l10w:l10?l10.wins:null};
    }));

}

  {name:'W. Abreu',pos:'LF',bats:'L',avg:.251,ops:.744,hr:13},{name:'D. Hamilton',pos:'2B',bats:'R',avg:.239,ops:.676,hr:5},
  {name:'R. Refsnyder',pos:'1B',bats:'R',avg:.264,ops:.758,hr:7}]}};
async function init(){
  const res=await Promise.all([
    loadJSON('data/processed/picks_today.json',null),
    loadJSON('data/processed/pitcher_cards.json',[]),
    loadJSON('data/processed/bullpen_report.json',[]),
    loadJSON('data/processed/live_scores.json',[]),
    loadJSON('data/processed/lineups.json',null),
    loadJSON('data/processed/team_stats.json',null)]);
  const picks=res[0],cards=res[1],pens=res[2],scores=res[3],lineups=res[4],team=res[5];
  DATA.demo=!picks||!((picks.games||picks).length);
  const src=DATA.demo?DEMO:picks;
  DATA.cards=(DATA.demo||!cards||!cards.length)?DEMO_CARDS:(Array.isArray(cards)?cards:(cards.pitchers||[]));
  DATA.pens=(DATA.demo||!pens||!pens.length)?DEMO_PENS:pens;
  DATA.scores=Array.isArray(scores)?scores:(scores.games||[]);
  DATA.lineups=lineups||(DATA.demo?DEMO_LU:null);
  DATA.team=indexTeamStats(team||(DATA.demo?DEMO_TEAM:null));
  const games=(Array.isArray(src)?src:(src.games||[])).map(normGame);
  window._G=games;
  document.getElementById('hdr-date').textContent=(src.date||'')+(DATA.demo?'  ·  sample data':'');
  document.getElementById('hdr-stamp').textContent=src.generated_at||src.updated_at||'—';
  renderRibbon(games);renderStrip();renderGames(games);renderSelect(games);
  if(games.length)renderDeep(0);
  DATA.standings=DATA.demo?DEMO_ST:await loadStandings();
  if(Object.keys(DATA.standings).length)renderGames(games);
  if(!team&&!DATA.demo){document.getElementById('dd-note').textContent=
    'Team offense bars need data/processed/team_stats.json — export it from mlb_team_stats_full_2026.csv. Lineups post about two hours before first pitch.';}
}
init();
